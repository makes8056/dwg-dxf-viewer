<!DOCTYPE html>
<!--
  _test-render.html — render.js を目で確かめるための確認用ページ（アプリ本体ではない）

  司令塔・ワーカーが手元のブラウザで開いて見る。図面ファイルは使わず、
  手で作った図形データ（drawing.js の形）を renderDrawing() に渡すだけ。

  見るポイント：
    1. 円弧の向き … 「90度の円弧」ラベルの右上に、実際に弧が右上向きに膨らんで出るか
    2. Y軸の向き … 「上」ラベルが画面の上に、「下」ラベルが画面の下に出るか
    3. 文字の向き … 回転させた文字が、期待した向きに傾いて読めるか
    4. 画面外カリング … 「範囲外（見えないはず）」の図形が本当に描かれないか（drawn/skippedの数で確認）
    5. 線の太さ … 拡大縮小しても線が同じ太さに見えるか（下のボタンで拡大縮小できる）
-->
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>render.js 確認用ページ</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 12px; background: #eee; }
  h1 { font-size: 16px; }
  #info { white-space: pre-wrap; background: #fff; padding: 8px; border: 1px solid #ccc; font-size: 13px; }
  canvas { border: 2px solid #333; background: #fff; display: block; margin-top: 8px; touch-action: none; }
  .buttons button { margin-right: 6px; margin-bottom: 6px; }
</style>
</head>
<body>
<h1>render.js 確認用ページ（このファイルはアプリ本体ではありません）</h1>
<div class="buttons">
  <button id="btnFit">全体表示</button>
  <button id="btnZoomIn">拡大（中心）</button>
  <button id="btnZoomOut">縮小（中心）</button>
  <button id="btnPanLeft">← 移動</button>
  <button id="btnPanRight">移動 →</button>
</div>
<div id="info">読み込み中…</div>
<canvas id="cv" width="900" height="600"></canvas>

<script type="module">
import { createViewport, fitToBounds, zoomAt, panBy, setSize } from './src/viewport.js';
import { renderDrawing } from './src/render.js';
import { finishDrawing, createDrawing } from './src/drawing.js';

// ------------------------------------------------------------
// 手で作った図形データ（drawing.js の形どおり）
// ------------------------------------------------------------
const drawing = createDrawing('dxf');

// Y軸の向き確認用：上下に文字と直線
drawing.entities.push(
  { type: 'text', layer: '0', color: '#000000', x: -10, y: 90, height: 6, rotation: 0, text: '上（図面のYが大きい方）' },
  { type: 'text', layer: '0', color: '#000000', x: -10, y: -90, height: 6, rotation: 0, text: '下（図面のYが小さい方）' },
  { type: 'line', layer: '0', color: '#0000ff', x1: 0, y1: -100, x2: 0, y2: 100 }, // 縦の基準線
  { type: 'line', layer: '0', color: '#0000ff', x1: -100, y1: 0, x2: 100, y2: 0 }, // 横の基準線
);

// 円弧の向き確認：中心(0,0)、半径40、0度→90度（右上に膨らむはず）
drawing.entities.push(
  { type: 'arc', layer: '0', color: '#ff0000', cx: 0, cy: 0, r: 40, startAngle: 0, endAngle: 90 },
  { type: 'text', layer: '0', color: '#ff0000', x: 5, y: 48, height: 5, rotation: 0, text: '←この円弧は右上に膨らむはず（0→90度）' },
);

// 別の円弧：中心(60,0)、半径20、270度→90度（右半分、東側に膨らむ半円）
drawing.entities.push(
  { type: 'arc', layer: '0', color: '#008000', cx: 60, cy: 0, r: 20, startAngle: 270, endAngle: 90 },
  { type: 'text', layer: '0', color: '#008000', x: 45, y: 25, height: 5, rotation: 0, text: '270→90度：右半分の半円のはず' },
);

// 円
drawing.entities.push(
  { type: 'circle', layer: '0', color: '#800080', cx: -60, cy: -60, r: 15 },
);

// 折れ線（閉じる）
drawing.entities.push(
  { type: 'polyline', layer: '0', color: '#ff8800', closed: true,
    points: [[-90, 60], [-70, 60], [-80, 80]] },
);

// 回転した文字（45度）
drawing.entities.push(
  { type: 'text', layer: '0', color: '#000000', x: 30, y: -40, height: 6, rotation: 45, text: '45度回転した文字' },
);

// 回転していない文字（比較用）
drawing.entities.push(
  { type: 'text', layer: '0', color: '#000000', x: 30, y: -55, height: 6, rotation: 0, text: '回転なしの文字（比較用）' },
);

// 小さすぎて読めないはずの文字（省かれる）
drawing.entities.push(
  { type: 'text', layer: '0', color: '#000000', x: -30, y: -40, height: 0.05, rotation: 0, text: 'これは小さすぎて省かれるはず' },
);

// 画面外カリング確認用：全体表示の範囲からは大きく外れた場所に線を置く
drawing.entities.push(
  { type: 'line', layer: '0', color: '#ff0000', x1: 5000, y1: 5000, x2: 5010, y2: 5010 },
);

finishDrawing(drawing);

// 「全体表示」は drawing.bounds（画面外カリング確認用の遠い線も含む）を使わない。
// 使うと、遠い線1本のせいで全体表示がものすごく縮小されてしまい、
// 手前の図形が豆粒になって確認できなくなる。
// ここでは確認したい主な図形の範囲だけを、手で指定する。
const mainBounds = { minX: -100, minY: -100, maxX: 100, maxY: 100 };

// ------------------------------------------------------------
// viewport と canvas
// ------------------------------------------------------------
const canvas = document.getElementById('cv');
const info = document.getElementById('info');
const dpr = window.devicePixelRatio || 1;

const cssWidth = 900;
const cssHeight = 600;
canvas.style.width = cssWidth + 'px';
canvas.style.height = cssHeight + 'px';
canvas.width = Math.round(cssWidth * dpr);
canvas.height = Math.round(cssHeight * dpr);

const vp = createViewport(cssWidth, cssHeight);
fitToBounds(vp, mainBounds);

function draw() {
  const ctx = canvas.getContext('2d');
  const result = renderDrawing(ctx, drawing, vp, { dpr });
  info.textContent =
    `entities: ${drawing.entities.length}\n` +
    `drawn: ${result.drawn}\n` +
    `skipped: ${result.skipped}（画面外カリングの1本 + 小さすぎる文字1本を含むはず → 2以上）\n` +
    `scale: ${vp.scale.toFixed(4)}\n` +
    `offsetX: ${vp.offsetX.toFixed(2)} offsetY: ${vp.offsetY.toFixed(2)}\n` +
    `devicePixelRatio: ${dpr}\n\n` +
    `確認ポイント：\n` +
    `・赤い円弧（0→90度）が中心の右上に膨らんでいるか\n` +
    `・緑の円弧（270→90度）が右半分の半円になっているか\n` +
    `・「上」の文字が画面の上、「下」の文字が画面の下にあるか\n` +
    `・45度回転した文字が、右肩上がりに傾いて見えるか\n` +
    `・「小さすぎて省かれるはず」の文字が見えていないか（skippedに含まれる）\n` +
    `・拡大／縮小ボタンを押しても線の太さが変わらないか`;
}

draw();

document.getElementById('btnFit').addEventListener('click', () => {
  fitToBounds(vp, mainBounds);
  draw();
});
document.getElementById('btnZoomIn').addEventListener('click', () => {
  zoomAt(vp, cssWidth / 2, cssHeight / 2, 1.5);
  draw();
});
document.getElementById('btnZoomOut').addEventListener('click', () => {
  zoomAt(vp, cssWidth / 2, cssHeight / 2, 1 / 1.5);
  draw();
});
document.getElementById('btnPanLeft').addEventListener('click', () => {
  panBy(vp, -80, 0);
  draw();
});
document.getElementById('btnPanRight').addEventListener('click', () => {
  panBy(vp, 80, 0);
  draw();
});
</script>
</body>
</html>
